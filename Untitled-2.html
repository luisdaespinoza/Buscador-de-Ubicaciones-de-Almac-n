<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Ubicaciones de Almacén</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --border-color: #ccc;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--secondary-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px var(--shadow-color);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.8em;
        }

        .search-container {
            margin-bottom: 25px;
            position: relative;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        #searchInput {
            flex-grow: 1;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
            padding-right: 40px;
            min-width: 200px;
        }

        #searchInput:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.2);
        }

        .clear-search-button {
            position: absolute;
            right: 55px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.2em;
            color: #999;
            cursor: pointer;
            padding: 5px;
            display: none;
        }

        .clear-search-button.visible {
            display: block;
        }

        .scanner-button {
            padding: 12px 15px;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .scanner-button:hover {
            background-color: #004494;
        }

        .results-container {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .result-item {
            padding: 12px 0;
            border-bottom: 1px dashed #eee;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item div {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 5px;
        }

        .result-item span {
            font-weight: 600;
            margin-right: 10px;
            flex-basis: 45%;
        }

        .result-item strong {
            color: var(--primary-color);
            flex-basis: 50%;
            text-align: right;
            word-break: break-all;
        }
        
        .result-item .full-text {
            width: 100%;
            text-align: left;
            font-size: 0.9em;
            color: #555;
            margin-top: 5px;
            word-wrap: break-word;
        }

        .no-results {
            text-align: center;
            color: #dc3545;
            padding: 15px;
            font-weight: 500;
        }

        .pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            gap: 15px;
        }

        .pagination-button {
            padding: 8px 15px;
            border: 1px solid var(--primary-color);
            border-radius: 5px;
            background-color: var(--primary-color);
            color: #fff;
            font-size: 0.9em;
            cursor: pointer;
        }

        .pagination-button:disabled {
            background-color: #cccccc;
            border-color: #cccccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #pageInfo {
            font-weight: 600;
            color: var(--primary-color);
            min-width: 120px;
            text-align: center;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fefefe;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            position: relative;
            text-align: center;
        }

        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
        }

        #scanner-container {
            width: 100%;
            height: 300px;
            background-color: #333;
            margin-top: 15px;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }

        #scanner-video { 
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }

        .loading-message {
            color: #fff;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }

        .scan-indicator {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(0, 255, 0, 0.5);
            display: none;
        }

        .scan-indicator.active {
            display: block;
        }

        .scan-indicator::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(to right, transparent, limegreen, transparent);
            animation: scan-line 2s infinite ease-in-out;
        }

        @keyframes scan-line {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        @media (max-width: 480px) {
            .search-container { flex-direction: column; }
            .result-item span, .result-item strong { flex-basis: 100%; text-align: left; }
        }

        .correction-item { display: flex; padding: 10px 0; border-bottom: 1px dashed #eee; }
        .correction-item input { margin-right: 10px; }
        .correction-text { flex-grow: 1; text-align: left; }
        .correction-item.checked .correction-text { text-decoration: line-through; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Buscador de Ubicaciones de Almacén</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Unidad, tambor, ubicación, material o texto...">
            <button id="clearSearchButton" class="clear-search-button">&times;</button>
            <button id="scanBarcodeButton" class="scanner-button">Escanear</button>
            <button id="viewCorrectionsButton" class="scanner-button" style="background-color: #6c757d;">Correcciones</button>
        </div>
        <div class="results-container" id="results">
            <div class="no-results" style="color: #666;">Cargando datos...</div>
        </div>
        <div class="pagination-controls">
            <button id="prevPage" class="pagination-button">&laquo; Anterior</button>
            <span id="pageInfo">Página 1 de 1</span>
            <button id="nextPage" class="pagination-button">Siguiente &raquo;</button>
        </div>
    </div>

    <!-- Modales -->
    <div id="barcodeScannerModal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="closeScanner">&times;</span>
            <h2>Escáner</h2>
            <div id="scanner-container">
                <video id="scanner-video" autoplay playsinline></video>
                <div id="scan-indicator" class="scan-indicator"></div>
                <div id="scanner-loading-message" class="loading-message">Cargando cámara...</div>
            </div>
        </div>
    </div>

    <div id="correctionsModal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="closeCorrectionsButton">&times;</span>
            <h2>Correcciones Pendientes</h2>
            <div id="correctionsList" style="text-align: left; max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
    <script>
        let storageData = [];
        let currentPage = 1;
        const recordsPerPage = 100;
        let currentFilteredData = [];

        const searchInput = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('results');
        const prevPageButton = document.getElementById('prevPage');
        const nextPageButton = document.getElementById('nextPage');
        const pageInfoSpan = document.getElementById('pageInfo');
        const clearSearchButton = document.getElementById('clearSearchButton');
        const barcodeScannerModal = document.getElementById('barcodeScannerModal');
        const correctionsModal = document.getElementById('correctionsModal');

        function displayPaginatedResults() {
            resultsDiv.innerHTML = '';
            if (currentFilteredData.length === 0) {
                resultsDiv.innerHTML = '<div class="no-results">No se encontraron resultados.</div>';
                updatePaginationControls(0);
                return;
            }

            const startIndex = (currentPage - 1) * recordsPerPage;
            const paginatedItems = currentFilteredData.slice(startIndex, startIndex + recordsPerPage);

            paginatedItems.forEach(item => {
                const resultItem = document.createElement('div');
                resultItem.classList.add('result-item');
                resultItem.innerHTML = `
                    <div><span>Ubicación:</span> <strong>${item.location}</strong></div>
                    <div><span>Material:</span> <strong>${item.material}</strong></div>
                    <div><span>Lote/Unidad:</span> <strong>${item.unit}</strong></div>
                    <div><span>Número de Tambor:</span> <strong>${item.drumNumber}</strong></div>
                    <div class="full-text"><span>Información adicional:</span> ${item.text}</div> `;
                resultsDiv.appendChild(resultItem);
            });
            updatePaginationControls(currentFilteredData.length);
        }

        function updatePaginationControls(totalResults) {
            const totalPages = Math.ceil(totalResults / recordsPerPage) || 1;
            pageInfoSpan.textContent = `Página ${currentPage} de ${totalPages}`;
            prevPageButton.disabled = currentPage === 1;
            nextPageButton.disabled = currentPage === totalPages;
        }

        async function loadData() {
            try {
                const response = await fetch('almacen_data.txt');
                if (!response.ok) throw new Error('No se pudo cargar el archivo de datos.');
                const textData = await response.text();

                storageData = textData.trim().split('\n').filter(line => line.includes('\t')).map(line => {
                    const parts = line.split('\t');
                    return {
                        location: parts[0]?.trim() || 'N/A',
                        material: parts[1]?.trim() || 'N/A',
                        unit: parts[2]?.trim() || 'N/A',
                        drumNumber: parts[3]?.trim() || 'N/A', // NUEVO CAMPO: Se asume columna 4
                        text: parts[4]?.trim() || 'N/A'
                    };
                });

                currentFilteredData = storageData;
                displayPaginatedResults();
            } catch (error) {
                resultsDiv.innerHTML = `<div class="no-results">Error: ${error.message}</div>`;
            }
        }

        searchInput.addEventListener('input', function() {
            const term = this.value.toLowerCase().trim();
            clearSearchButton.style.display = term ? 'block' : 'none';
            currentFilteredData = storageData.filter(item => 
                Object.values(item).some(val => val.toLowerCase().includes(term))
            );
            currentPage = 1;
            displayPaginatedResults();
        });

        clearSearchButton.onclick = () => {
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input'));
        };

        prevPageButton.onclick = () => { if (currentPage > 1) { currentPage--; displayPaginatedResults(); }};
        nextPageButton.onclick = () => { if (currentPage * recordsPerPage < currentFilteredData.length) { currentPage++; displayPaginatedResults(); }};

        // Lógica de Escáner y Modal (simplificada para brevedad)
        let codeReader = null;
        document.getElementById('scanBarcodeButton').onclick = () => {
            barcodeScannerModal.style.display = 'flex';
            startScanner();
        };

        async function startScanner() {
            if (!codeReader) codeReader = new ZXing.BrowserMultiFormatReader();
            try {
                codeReader.decodeFromVideoDevice(null, 'scanner-video', (result, err) => {
                    if (result) {
                        searchInput.value = result.getText().slice(-18);
                        barcodeScannerModal.style.display = 'none';
                        codeReader.reset();
                        searchInput.dispatchEvent(new Event('input'));
                    }
                });
                document.getElementById('scanner-loading-message').style.display = 'none';
                document.getElementById('scan-indicator').classList.add('active');
            } catch (e) {
                console.error(e);
            }
        }

        document.getElementById('closeScanner').onclick = () => {
            barcodeScannerModal.style.display = 'none';
            if (codeReader) codeReader.reset();
        };

        // Carga inicial
        loadData();
    </script>
</body>
</html>
