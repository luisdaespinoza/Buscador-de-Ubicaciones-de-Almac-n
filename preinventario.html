<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Consolidado por Ubicación</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --border-color: #ccc;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--secondary-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px var(--shadow-color);
            width: 100%;
            max-width: 1000px;
            box-sizing: border-box;
            position: relative;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 20px;
        }

        .filter-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        @media (min-width: 768px) {
            .filter-section {
                grid-template-columns: 1fr 1fr;
            }
            .filter-section > button {
                grid-column: 1 / -1;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: bold;
        }
        
        .checkbox-container {
            height: 150px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 10px;
            background-color: #fff;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 3px;
        }

        .checkbox-item label {
            font-weight: normal;
            margin-left: 8px;
            cursor: pointer;
            font-size: 0.9em;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 1em;
            box-sizing: border-box;
        }

        .results-section {
            margin-top: 30px;
        }

        #resultsTable {
            width: 100%;
            border-collapse: collapse;
        }

        #resultsTable th, #resultsTable td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: left;
            font-size: 0.9em; 
            vertical-align: top;
        }

        #resultsTable th {
            background-color: var(--primary-color);
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .results-list-container {
            max-height: 600px;
            overflow-y: auto;
        }
        
        #clearButton {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #dc3545;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        #clearButton:hover {
            background-color: #c82333;
        }
        
        .list-cell {
            white-space: normal;
            word-break: break-word;
            line-height: 1.3;
        }
        
        .list-cell strong {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Inventario Consolidado por Ubicación</h1>

        <div class="filter-section">
             <div class="input-group">
                <label for="grupoFilterContainer">Filtrar por Grupo de Artículo (Código - Descripción)</label>
                <div id="grupoFilterContainer" class="checkbox-container">
                    <p class="loading-message">Cargando grupos...</p>
                </div>
            </div>
            <div class="input-group">
                <label for="searchInput">Buscar por Ubicación o Material</label>
                <input type="text" id="searchInput" placeholder="Buscar por Ubicación, Código o Nombre de Material">
            </div>
            <button id="clearButton">Limpiar Filtros</button>
        </div>

        <div class="results-section">
            <h2>Resultados Consolidados</h2>
            <div class="results-list-container">
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th style="width: 15%;">Ubicación</th>
                            <th style="width: 45%;">Materiales Consolidados (Código - Nombre)</th>
                            <th style="width: 20%;">Cant. Original (Suma)</th>
                            <th style="width: 20%;">Cant. Calculada (Factor de Peso)</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                        <tr><td colspan="4">Cargando datos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allRawData = []; 
        let materialWeightMap = {}; 
        let codeToGroupMap = {}; 
        let consolidatedDataCache = []; 

        const searchInput = document.getElementById('searchInput');
        const grupoFilterContainer = document.getElementById('grupoFilterContainer');
        const resultsTableBody = document.getElementById('resultsTableBody');
        const clearButton = document.getElementById('clearButton');

        function safeParseNumber(str) {
            if (!str) return 0;
            // Maneja el formato europeo/chileno (punto como miles, coma como decimal)
            return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0;
        }

        async function loadMaterialWeights() {
            try {
                const response = await fetch('materiales.txt');
                if (!response.ok) {
                    throw new Error(`Error ${response.status} al cargar materiales.txt. Asegúrate de que el archivo esté en la misma carpeta que preinventario.html.`);
                }
                const textData = await response.text();
                textData.trim().split('\n').forEach(line => {
                    // La división por tabulación o espacios es crucial aquí
                    const parts = line.split(/[\t\s]+/).filter(Boolean);
                    if (parts.length >= 2) {
                        const materialCode = parts[0].trim();
                        // El factor de peso es la segunda columna
                        const weight = safeParseNumber(parts[1]); 
                        materialWeightMap[materialCode] = weight;
                    }
                });
                console.log('✅ materiales.txt cargado correctamente. Total de factores de peso:', Object.keys(materialWeightMap).length);
            } catch (error) {
                console.error('❌ ERROR CRÍTICO al cargar materiales.txt:', error.message);
                alert('Advertencia: No se pudo cargar el archivo materiales.txt. La columna "Cant. Calculada" será igual a la "Cant. Original". Por favor, revisa la consola (F12) para más detalles.');
            }
        }

        async function loadGrupoData() {
            try {
                const response = await fetch('grupos.txt');
                if (!response.ok) {
                    throw new Error(`Error ${response.status} al cargar el archivo grupos.txt.`);
                }
                const textData = await response.text();
                textData.trim().split('\n').forEach(line => {
                    const parts = line.split('\t');
                    if (parts.length >= 2) {
                        const code = parts[0].trim();
                        const description = parts.slice(1).join('\t').trim();
                        codeToGroupMap[code] = description; 
                    }
                });
                console.log('✅ grupos.txt cargado correctamente.');
            } catch (error) {
                console.error('❌ ERROR al cargar grupos.txt:', error.message);
            }
        }

        async function loadRawData() {
            resultsTableBody.innerHTML = '<tr><td colspan="4">Cargando datos iniciales...</td></tr>';
            
            await Promise.all([loadMaterialWeights(), loadGrupoData()]);

            try {
                const response = await fetch('almacen_data.txt');
                if (!response.ok) {
                    throw new Error(`Error ${response.status} al cargar almacen_data.txt.`);
                }
                const textData = await response.text();
                
                allRawData = textData.trim().split('\n').filter(line => line.includes('\t')).map(line => {
                    const parts = line.split('\t');
                    
                    const materialCode = parts[1] ? parts[1].trim() : 'SIN_MATERIAL'; 
                    const materialDescription = parts[4] ? parts[4].trim() : 'SIN DESCRIPCIÓN'; 
                    const materialLabel = materialCode + ' - ' + materialDescription; 
                    
                    const grupoCode = parts[5] ? parts[5].trim() : 'SIN_GRUPO';
                    const grupoDescription = codeToGroupMap[grupoCode] || 'GRUPO DESCONOCIDO';
                    const grupoLabel = grupoCode + ' - ' + grupoDescription; 
                    
                    // Si materialWeightMap está vacío (por fallo de carga), weightFactor será 1
                    const weightFactor = materialWeightMap[materialCode] || 1;
                    const quantity = safeParseNumber(parts[6]);
                    
                    return {
                        location: parts[0] ? parts[0].trim() : 'SIN_UBICACION', 
                        materialCode: materialCode,
                        materialDescription: materialDescription,
                        materialLabel: materialLabel, 
                        grupoCode: grupoCode,
                        grupoDescription: grupoDescription,
                        grupoLabel: grupoLabel, 
                        quantity: quantity,
                        weightedQuantity: quantity / weightFactor
                    };
                }).filter(item => item.location && item.quantity !== 0);
                
                console.log('✅ almacen_data.txt cargado correctamente.');
                populateFilters();
                calculateAndCacheConsolidation();

            } catch (error) {
                console.error('❌ ERROR al cargar almacen_data.txt:', error.message);
                resultsTableBody.innerHTML = `<tr><td colspan="4" style="color: red;">Error al cargar datos principales: ${error.message}.</td></tr>`;
            }
        }

        function populateFilters() {
            grupoFilterContainer.innerHTML = '';
            const gruposLabels = [...new Set(allRawData.map(item => item.grupoLabel))].sort((a, b) => a.localeCompare(b));
            
            gruposLabels.forEach(label => {
                const grupoCode = label.split(' - ')[0]; 
                const itemId = `grupo-${grupoCode.replace(/[^a-zA-Z0-9]/g, '')}`;
                
                const checkboxDiv = document.createElement('div');
                checkboxDiv.classList.add('checkbox-item');
                checkboxDiv.innerHTML = `
                    <input type="checkbox" id="${itemId}" value="${label}">
                    <label for="${itemId}">${label}</label>
                `;
                grupoFilterContainer.appendChild(checkboxDiv);
            });

            grupoFilterContainer.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                checkbox.addEventListener('change', calculateAndCacheConsolidation); 
            });
            
            if (gruposLabels.length === 0) {
                 grupoFilterContainer.innerHTML = '<p class="loading-message">No se encontraron grupos de artículo.</p>';
            }
        }

        function calculateAndCacheConsolidation() {
            resultsTableBody.innerHTML = '<tr><td colspan="4">Calculando consolidación...</td></tr>';
            
            setTimeout(() => {
                const selectedGruposLabels = Array.from(grupoFilterContainer.querySelectorAll('input[type="checkbox"]:checked')).map(checkbox => checkbox.value);
                
                const dataToConsolidate = allRawData.filter(item => {
                    return selectedGruposLabels.length === 0 || selectedGruposLabels.includes(item.grupoLabel);
                });

                const groupedData = {};

                dataToConsolidate.forEach(item => {
                    if (!groupedData[item.location]) {
                        groupedData[item.location] = {
                            location: item.location,
                            totalQuantity: 0,
                            totalWeighted: 0,
                            materials: new Map() 
                        };
                    }
                    
                    groupedData[item.location].totalQuantity += item.quantity;
                    groupedData[item.location].totalWeighted += item.weightedQuantity;
                    
                    if (item.materialCode && item.materialDescription) {
                        groupedData[item.location].materials.set(item.materialCode, item.materialDescription);
                    }
                });
                
                consolidatedDataCache = Object.values(groupedData).sort((a, b) => a.location.localeCompare(b.location));
                
                filterAndDisplayResults();
            }, 50);
        }

        function filterAndDisplayResults() {
            resultsTableBody.innerHTML = '<tr><td colspan="4">Filtrando...</td></tr>';
            
            setTimeout(() => {
                const searchTerm = searchInput.value.toLowerCase().trim();
                
                if (searchTerm === '') {
                    displayResults(consolidatedDataCache);
                    return;
                }
                
                const filteredBySearch = consolidatedDataCache.filter(item => {
                    // 1. Búsqueda por Ubicación
                    if (item.location.toLowerCase().includes(searchTerm)) {
                        return true;
                    }
                    
                    // 2. Búsqueda por Código o Nombre de Material
                    const materialsMatch = Array.from(item.materials.entries()).some(([code, description]) => {
                        return code.toLowerCase().includes(searchTerm) || description.toLowerCase().includes(searchTerm);
                    });
                    
                    return materialsMatch;
                });
                
                displayResults(filteredBySearch);
            }, 50);
        }


        function displayResults(data) {
            resultsTableBody.innerHTML = '';

            if (data.length === 0) {
                resultsTableBody.innerHTML = '<tr><td colspan="4">No se encontraron ubicaciones para los filtros aplicados.</td></tr>';
                return;
            }
            
            data.forEach(item => {
                const row = resultsTableBody.insertRow();
                
                // Ubicación
                const cellLocation = row.insertCell();
                cellLocation.textContent = item.location;

                // Materiales Consolidados
                const cellMaterials = row.insertCell();
                cellMaterials.classList.add('list-cell');
                const materialsText = Array.from(item.materials.entries()).map(([code, description]) => {
                    return `<strong>${code}</strong>: ${description}`;
                }).join('<br>');
                cellMaterials.innerHTML = materialsText || 'N/A';
                
                // Cantidad Original (Suma)
                const cellQuantity = row.insertCell();
                cellQuantity.textContent = item.totalQuantity.toLocaleString('es-CL', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });

                // Cantidad Calculada (División)
                const cellWeighted = row.insertCell();
                cellWeighted.textContent = item.totalWeighted.toLocaleString('es-CL', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
            });
        }

        // Event listeners
        searchInput.addEventListener('input', filterAndDisplayResults);
        
        clearButton.addEventListener('click', () => {
            searchInput.value = '';
            grupoFilterContainer.querySelectorAll('input[type="checkbox"]').forEach(checkbox => checkbox.checked = false);
            calculateAndCacheConsolidation(); 
        });

        document.addEventListener('DOMContentLoaded', loadRawData);
    </script>
</body>
</html>
